name: Java CI
on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - run: mvn package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: my-app-jar-${{ matrix.os }}
          path: target/*.jar